<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>px → rem</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Конвертер px в rem</h1>
    <label for="px-input">Размер в пикселях</label>
    <input id="px-input" type="text" inputmode="decimal">
    <button id="convert-btn">Перевести</button>
    <p id="result" aria-live="polite"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
